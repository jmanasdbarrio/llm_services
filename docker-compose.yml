name: llm_services
services:
  ollama:
    image: ollama/ollama:latest
    pull_policy: always
    container_name: ollama
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=2
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
        limits:
          memory: 16G
    entrypoint: ["sh", "/entrypoint.sh"]
    restart: unless-stopped
    networks:
      - docker-internal

  ollama-health-check:
    image: ollama/ollama:latest
    pull_policy: always
    container_name: ollama-health-check
    depends_on:
      ollama:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      sh -c 'for i in $(seq 1 900); do ollama list |
      grep -q qwen3.5:9b && ollama list |
      grep -q gemma4:e4b-rag && ollama list |
      grep -q nomic-embed-text:v1.5
      && exit 0; sleep 5; done; exit 1'
    restart: "no"
    networks:
      - docker-internal

  searxng:
    image: searxng/searxng:latest
    pull_policy: always
    container_name: searxng
    volumes:
      - ./searxng_data:/etc/searxng:rw
    environment:
      - SEARXNG_HOSTNAME=localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://localhost:8080/search?q=test&format=json",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20s
    depends_on:
      ollama-health-check:
        condition: service_completed_successfully
    networks:
      - docker-internal

  open-webui:
    image: ghcr.io/open-webui/open-webui:cuda
    pull_policy: always
    container_name: open-webui
    ports:
      - "8091:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - WEBUI_AUTH=True
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - ENABLE_WEB_SEARCH=True
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
      - SEARXNG_LANGUAGE=all
      - WEB_SEARCH_RESULT_COUNT=3
    depends_on:
      ollama-health-check:
        condition: service_completed_successfully
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    networks:
      - docker-internal

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.2.2
    pull_policy: always
    container_name: kokoro-tts
    ports:
      - "8880:8880"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    restart: unless-stopped
    networks:
      - docker-internal

volumes:
  open-webui:

networks:
  docker-internal:
    external: true
    name: docker_internal-docker_internal
